    title: 插件安全检查 (CPC)
    help: |
      CPC 命令:
        spak cpc check          检查所有插件和包
        spak cpc sandbox <名称> 在沙箱中隔离插件
        spak cpc sandbox stop <名称> 停止沙箱中的插件
        spak cpc ssetps         启动 SSetPS 监控
        spak cpc circuit <名称> 触发熔断器
        spak cpc circuit restore <名称> 恢复熔断器
        spak cpc status         显示 CPC 状态
