# zh locale for spak CLI
spak:
  intro:
    description: "多文件服务框架"
  general:
    error: "发生错误"
  cli:
    serve:
      not_running: "Spak 服务未运行"
      started: "Spak 服务已启动 (pid={pid})"
      stopping: "正在关闭 Spak 服务... ({signal})"
      start_failed: "启动 Spak 服务失败: {error}"
    stop:
      sent: "已发送 {signal} 信号到 Spak 服务 (pid={pid})"
      failed: "停止 Spak 服务失败 (pid={pid}): {error}"
    status:
      title: "Spak 服务状态"
      service: "服务"
      pid_value: "  PID: {pid}"
      port_value: "  端口: {port}"
      uptime_value: "  运行时间: {uptime}"
      plugins_value: "  插件数: {count}"
      requests_value: "  请求数: {count}"
      hardware: "硬件"
      memory_value: "  内存: {used} / {total}"
      free_value: "  可用: {free}"
      load_value: "  负载: {load}"
      cpu_value: "  CPU: {usage}"
      platform_value: "  平台: {platform}"
      environment: "环境"
      host_value: "  主机: {host}"
      node_value: "  Node: {version}"
      log_value: "  日志: spak.log"
      pid_file_value: "  PID文件: .spak.pid"
      not_running: "Spak 服务未运行"
    inject:
      added: "已注入 @spakjs/i18n 依赖到 {pkg}"
      created: "已为 {pkg} 创建 locales 目录"
  cpc:
    title: "插件安全检查 (CPC)"
    help: |
      CPC 命令:
        spak cpc check          检查所有插件和包
        spak cpc sandbox <名称> 在沙箱中隔离插件
        spak cpc sandbox stop <名称> 停止沙箱中的插件
        spak cpc ssetps         启动 SSetPS 监控
        spak cpc circuit <名称> 触发熔断器
        spak cpc circuit restore <名称> 恢复熔断器
        spak cpc status         显示 CPC 状态
    check:
      starting: "正在检查插件和包..."
      complete: "{valid}/{total} 项检查通过"
    sandbox:
      isolating: "正在隔离插件: {name}..."
      isolated: "插件 {name} 已隔离 (pid={pid})"
      terminated: "沙箱已终止 (pid={pid})"
      usage_start: "用法: spak cpc sandbox <名称>"
      usage_stop: "用法: spak cpc sandbox stop <名称>"
      enabled: "沙箱已启用"
      disabled_warning: "沙箱已禁用 — 插件将在无隔离环境下运行 (不安全!)"
    ssetps:
      monitoring: "SSetPS 监控已启动"
      memory_warning: "内存使用率 {usage}%"
      memory_cleaned: "GC 释放了 {freed}MB"
      circuit_break: "已为 {name} 触发熔断器"
      circuit_open: "{name} 熔断器已断开"
      circuit_restored: "{name} 熔断器已恢复"
      firewall_rule: "防火墙规则: {rule}"
    test:
      serve: "正在启动测试服务器..."
      serve_running: "测试服务器运行在 {url}"
      starting: "正在运行 CPC 测试..."
      complete: "{pass}/{total} 项测试通过"
    config:
      not_available: "CPC 未启用。请在配置中设置 'cpc.enabled: true'"
    process_isolation:
      enabled: "进程隔离已启用"
    status:
      sandbox: "沙箱:"
      circuit_breakers: "熔断器:"
      ssetps: "SSetPS:"
      active: "活跃"
      inactive: "未活跃"
      memory: "内存:"
      unknown: "未知命令: {sub}"
    circuit:
      usage_restore: "用法: spak cpc circuit restore <名称>"
      usage_trigger: "用法: spak cpc circuit <名称>"
  ccmd:
    config:
      help: |
        配置命令:
          spak config list          列出所有配置
          spak config get <键>     获取配置值
          spak config set <键> <值>  设置配置值
      get_usage: "用法: spak config get <键>"
      key_not_found: "未找到键: {key}"
      set_usage: "用法: spak config set <键> <值>"
      language_invalid: "无效的语言: {lang}。你可以选择：{options}"
      language_set: "语言已设置为: {lang}"
      set_success: "已设置 {key} = {value}"
  cli:
    banner: "spak v{version} · {description}"
    version_line: "spak/{version} {platform} node-{nodever}"
  cpc:
    check:
      ok: "正常"
    sandbox:
      isolation_aborted: "{msg} — 隔离已中止"
      started: "[沙箱] 插件 {name} 已启动"
      error: "[沙箱] {name} 错误: {error}"
    ssetps:
      tip: "  提示: 使用 NODE_OPTIONS=\"--expose-gc\" 启动可让 SSetPS 在内存过高时强制 GC"
    test:
      debug_enabled: "[DEBUG] 调试模式已启用"
      debug_level: "[DEBUG] 日志级别: verbose"
      debug_env: "[DEBUG] 环境: test"
    status:
      memory_detail: "{used} / {limit}MB (阈值 80%)"
  server:
    started: "Spak Server 已在 http://localhost:{port} 启动"
    desktop: "桌面: {name}"
    routes: "路由: {count} 已注册"
    apps: "应用: {apps}"
    desktop_none: "无"
    apps_none: "无"
    desktop_selected: "[server] 桌面已选择: {name}"
    desktop_auto: "[server] 桌面自动选择: {name}"
    app_registered: "[server] 应用已注册: {name}"
    app_discovered: "[server] 应用已发现: {name} (来自 {pak})"
    app_no_manifest: "[server] {pak}: 内部缺少 spak.app.json"
    app_no_name: "[server] {pak}: manifest.name 缺失"
    app_load_failed: "[server] 加载 {pak} 失败: {error}"
    app_dir_not_found: "[server] 应用目录未找到: {dir}"
    app_discovery_failed: "[server] 应用发现失败: {error}"
    manifest_name_required: "manifest.name 为必填项"
    not_found: "未找到"
  spm:
    title: "spm — Spak 包管理器"
    usage: |
      用法:  spm <命令> [选项]
      命令:
        pack <appDir>       打包 app 目录为 .pak 文件
        version             显示 spm 版本
      选项:
        --out <file>        输出 .pak 路径 (默认: ~/.spak/.apps/<name>.pak)
        -h, --help          显示此帮助信息
    version: "spm/0.0.1"
    pack_requires_dir: "错误: spm pack 需要一个 app 目录"
    packed: "✓ 已打包 {appDir} → {target}"
    pack_error: "错误: {error}"
    unknown_command: '错误: 未知命令 "{cmd}"'
  loader:
    config_not_found: |
      未找到配置文件
      Spak 搜索了以下位置但未找到配置文件:
        - {path1}
        - {path2}
        - {path3}
      请创建一个配置文件，例如:
        spak.config.yml 或 spak.config.json 或 spak.yml 或 spak.json
  ino:
    blocked: 'INO: 插件 "{declarer}" 被禁止启动，因为它声明了"我不要"插件 "{target}"（已存在）。'
  desktop:
    lock_cannot_unlock: "🔒 暂时无法解锁"
    lock_click_hint: "点击任意位置尝试解锁"
  log:
    banner_spak: "          S P A K   S E R V E R       "
    started: "✓ Spak v{version} 已启动 (pid={pid})"
    config: "  config: {path}"
    listening: "  listening: {host}:{port}"
    plugins: "  plugins: {list}"
    shutting_down: "◇ Spak 正在关闭 (pid={pid}, signal={signal}, uptime={uptime})"
